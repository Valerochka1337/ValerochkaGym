# Robolectric 4.16 ships no android-all jars for SDK 37 (compile/target sdk); pin to 36. Test JVM is JDK 21.
sdk=36

# Unit tests construct their dependencies; do not start production sync/WorkManager in each sandbox.
# Tests of application startup must explicitly opt in with @Config(application = GymApplication::class).
application=android.app.Application
