name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.release_metadata.outputs.release_tag }}
      release_version: ${{ steps.release_metadata.outputs.release_version }}
      release_apk: ${{ steps.release_metadata.outputs.release_apk }}
      release_checksum: ${{ steps.release_metadata.outputs.release_checksum }}
      artifact_name: ${{ steps.release_metadata.outputs.artifact_name }}

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::Repository secret RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Print failed test summary
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(app/build/test-results/testDebugUnitTest/TEST-*.xml)
          if (( ${#reports[@]} == 0 )); then
            echo "No JUnit XML reports were generated."
            exit 0
          fi

          awk '
            /<testcase / { testcase = $0 }
            /<failure / {
              print "==> " FILENAME
              print testcase
              in_failure = 1
            }
            in_failure { print }
            /<\/failure>/ { in_failure = 0 }
          ' "${reports[@]}"

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify signature and prepare release artifact
        id: release_metadata
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          metadata="app/build/outputs/apk/release/output-metadata.json"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"

          if [[ -z "$apksigner_path" ]]; then
            echo "::error::apksigner was not found in ANDROID_HOME."
            exit 1
          fi

          "$apksigner_path" verify --verbose --print-certs "$apk"

          version_name="$(jq -r '.elements[0].versionName' "$metadata")"
          version_code="$(jq -r '.elements[0].versionCode' "$metadata")"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName must be stable SemVer, got: $version_name"
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::versionCode must be a positive integer, got: $version_code"
            exit 1
          fi

          release_tag="v$version_name"
          release_apk="ValerochkaGym-v$version_name.apk"
          release_checksum="$release_apk.sha256"
          artifact_name="ValerochkaGym-release-${{ github.run_number }}"
          artifact_dir="app/build/release-artifact"
          mkdir -p "$artifact_dir"
          cp "$apk" "$artifact_dir/$release_apk"
          cp "app/build/outputs/mapping/release/mapping.txt" "$artifact_dir/mapping.txt"

          digest="$(sha256sum "$artifact_dir/$release_apk" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$digest" "$release_apk" > "$artifact_dir/$release_checksum"

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_apk=$release_apk" >> "$GITHUB_OUTPUT"
          echo "release_checksum=$release_checksum" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release_metadata.outputs.artifact_name }}
          path: app/build/release-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -x ./gradlew ]]; then
            ./gradlew --stop || true
          fi
          rm -f "$RUNNER_TEMP/release.jks"

  publish-release:
    name: Publish new GitHub Release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifact

      - name: Publish version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          RELEASE_APK: ${{ needs.build.outputs.release_apk }}
          RELEASE_CHECKSUM: ${{ needs.build.outputs.release_checksum }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "::error::Git tag $GITHUB_REF_NAME does not match app version $RELEASE_TAG."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists; version was not republished."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            "release-artifact/$RELEASE_APK#Подписанный APK" \
            "release-artifact/$RELEASE_CHECKSUM#SHA-256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ValerochkaGym $RELEASE_VERSION" \
            --generate-notes \
            --latest
